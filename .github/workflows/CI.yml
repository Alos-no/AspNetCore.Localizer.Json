# CI workflow for building and testing the solution
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore test/AspNetCore.Localizer.Json.Test/AspNetCore.Localizer.Json.Test.csproj

      - name: Build
        run: dotnet build test/AspNetCore.Localizer.Json.Test/AspNetCore.Localizer.Json.Test.csproj --no-restore -c Release

      - name: Test
        run: dotnet test test/AspNetCore.Localizer.Json.Test/AspNetCore.Localizer.Json.Test.csproj --no-build --verbosity normal -c Release
